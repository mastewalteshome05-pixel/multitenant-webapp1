<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ethio Delivery - ፈጣን መላኪያ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ============================================================
           RESET & BASE
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #0a0a0a;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ============================================================
           SPLASH CONTAINER
           ============================================================ */
        .splash-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .splash-container.hidden {
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
        }

        /* ============================================================
           BACKGROUND PARTICLES
           ============================================================ */
        .bg-particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .bg-particles span {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            animation: floatParticle 8s infinite linear;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1);
                opacity: 0;
            }
        }

        /* ============================================================
           1) LOGO ANIMATION
           ============================================================ */
        .logo-wrapper {
            position: relative;
            z-index: 2;
            text-align: center;
            opacity: 0;
            transform: scale(0.5);
            animation: logoEntrance 2s ease forwards;
        }

        @keyframes logoEntrance {
            0% {
                opacity: 0;
                transform: scale(0.5);
                filter: blur(8px);
            }
            60% {
                opacity: 1;
                transform: scale(1.1);
                filter: blur(0px);
            }
            100% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0px);
            }
        }

        .logo-wrapper .logo-icon {
            font-size: 80px;
            display: block;
            margin-bottom: 10px;
            animation: glowPulse 2s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%,
            100% {
                filter: drop-shadow(0 0 20px rgba(255, 107, 53, 0.3));
            }
            50% {
                filter: drop-shadow(0 0 40px rgba(255, 107, 53, 0.6));
            }
        }

        .logo-wrapper h1 {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: 6px;
            background: linear-gradient(135deg, #ff6b35, #ff4500, #ff6b35);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s ease-in-out infinite;
            text-shadow: 0 0 40px rgba(255, 107, 53, 0.2);
        }

        @keyframes shimmer {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .logo-wrapper .subtitle {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-top: 6px;
            font-weight: 300;
        }

        .logo-wrapper .subtitle .highlight {
            color: #ff6b35;
        }

        /* ============================================================
           2) DELIVERY TRUCK
           ============================================================ */
        .truck-container {
            position: absolute;
            z-index: 3;
            top: 50%;
            left: -80px;
            transform: translateY(-50%);
            animation: truckMove 4s ease-in-out forwards;
            animation-delay: 0.5s;
        }

        @keyframes truckMove {
            0% {
                left: -80px;
                opacity: 0;
                transform: translateY(-50%) scale(0.8);
            }
            10% {
                opacity: 1;
                transform: translateY(-50%) scale(1);
            }
            70% {
                left: calc(50% + 80px);
                transform: translateY(-50%) scale(1) rotate(0deg);
            }
            75% {
                transform: translateY(-50%) scale(1.1) rotate(-3deg);
            }
            85% {
                transform: translateY(-50%) scale(1) rotate(0deg);
            }
            100% {
                left: calc(50% + 80px);
                transform: translateY(-50%) scale(1);
                opacity: 1;
            }
        }

        .truck-container .truck {
            font-size: 50px;
            filter: drop-shadow(0 0 20px rgba(255, 107, 53, 0.4));
            animation: truckBounce 0.5s ease-in-out 3;
            animation-delay: 1.5s;
        }

        @keyframes truckBounce {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }

        .truck-container .truck-trail {
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(to right, transparent, rgba(255, 107, 53, 0.3), transparent);
            border-radius: 2px;
            animation: trailGlow 1s ease-in-out infinite;
        }

        @keyframes trailGlow {
            0%,
            100% {
                opacity: 0.3;
                transform: scaleX(0.8);
            }
            50% {
                opacity: 0.8;
                transform: scaleX(1.2);
            }
        }

        /* ============================================================
           3) MAP ROUTE
           ============================================================ */
        .map-container {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 100px;
            z-index: 1;
            opacity: 0;
            animation: mapFade 1s ease forwards;
            animation-delay: 1.5s;
        }

        @keyframes mapFade {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 0.6;
                transform: translateX(-50%) translateY(0);
            }
        }

        .map-container .map-line {
            position: absolute;
            top: 50%;
            left: 10%;
            width: 80%;
            height: 3px;
            background: rgba(255, 107, 53, 0.15);
            border-radius: 2px;
            transform: translateY(-50%);
            overflow: hidden;
        }

        .map-container .map-line .line-progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, #ff6b35, #ff4500);
            border-radius: 2px;
            animation: drawLine 3s ease-in-out forwards;
            animation-delay: 1.5s;
            box-shadow: 0 0 20px rgba(255, 107, 53, 0.3);
        }

        @keyframes drawLine {
            0% {
                width: 0%;
            }
            100% {
                width: 100%;
            }
        }

        .map-container .map-pins {
            position: absolute;
            top: 50%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            transform: translateY(-50%);
            padding: 0 10px;
        }

        .map-container .map-pins .pin {
            font-size: 24px;
            animation: pinPulse 1.5s ease-in-out infinite;
        }

        .map-container .map-pins .pin.start {
            animation-delay: 0s;
        }

        .map-container .map-pins .pin.end {
            animation-delay: 0.5s;
        }

        @keyframes pinPulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.3);
            }
        }

        /* ============================================================
           4) TEXT REVEAL
           ============================================================ */
        .text-reveal {
            position: absolute;
            bottom: 160px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            text-align: center;
            opacity: 0;
            animation: textFadeIn 1s ease forwards;
            animation-delay: 2.8s;
        }

        @keyframes textFadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .text-reveal .slogan {
            font-size: 22px;
            font-weight: 700;
            color: white;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .text-reveal .slogan span {
            display: inline-block;
            opacity: 0;
            animation: letterReveal 0.5s ease forwards;
        }

        .text-reveal .slogan span:nth-child(1) {
            animation-delay: 3.0s;
        }
        .text-reveal .slogan span:nth-child(2) {
            animation-delay: 3.1s;
        }
        .text-reveal .slogan span:nth-child(3) {
            animation-delay: 3.2s;
        }
        .text-reveal .slogan span:nth-child(4) {
            animation-delay: 3.3s;
        }
        .text-reveal .slogan span:nth-child(5) {
            animation-delay: 3.4s;
        }
        .text-reveal .slogan span:nth-child(6) {
            animation-delay: 3.5s;
        }
        .text-reveal .slogan span:nth-child(7) {
            animation-delay: 3.6s;
        }
        .text-reveal .slogan span:nth-child(8) {
            animation-delay: 3.7s;
        }
        .text-reveal .slogan span:nth-child(9) {
            animation-delay: 3.8s;
        }
        .text-reveal .slogan span:nth-child(10) {
            animation-delay: 3.9s;
        }
        .text-reveal .slogan span:nth-child(11) {
            animation-delay: 4.0s;
        }
        .text-reveal .slogan span:nth-child(12) {
            animation-delay: 4.1s;
        }
        .text-reveal .slogan span:nth-child(13) {
            animation-delay: 4.2s;
        }
        .text-reveal .slogan span:nth-child(14) {
            animation-delay: 4.3s;
        }
        .text-reveal .slogan span:nth-child(15) {
            animation-delay: 4.4s;
        }
        .text-reveal .slogan span:nth-child(16) {
            animation-delay: 4.5s;
        }
        .text-reveal .slogan span:nth-child(17) {
            animation-delay: 4.6s;
        }
        .text-reveal .slogan span:nth-child(18) {
            animation-delay: 4.7s;
        }
        .text-reveal .slogan span:nth-child(19) {
            animation-delay: 4.8s;
        }
        .text-reveal .slogan span:nth-child(20) {
            animation-delay: 4.9s;
        }

        @keyframes letterReveal {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.8);
                filter: blur(4px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0px);
            }
        }

        .text-reveal .sub-slogan {
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-top: 4px;
            font-weight: 300;
        }

        /* ============================================================
           5) PACKAGE DELIVERED EFFECT
           ============================================================ */
        .package-effect {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 4;
            font-size: 30px;
            opacity: 0;
            animation: packagePop 0.8s ease forwards;
            animation-delay: 2.5s;
            pointer-events: none;
        }

        @keyframes packagePop {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.3) rotate(-20deg);
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.5) rotate(10deg);
            }
            70% {
                transform: translate(-50%, -50%) scale(0.9) rotate(-5deg);
            }
            100% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
            }
        }

        .package-effect .confetti {
            position: absolute;
            font-size: 14px;
            animation: confettiFall 1s ease forwards;
            animation-delay: 2.6s;
        }

        .package-effect .confetti:nth-child(1) {
            top: -20px;
            left: -30px;
            animation-delay: 2.7s;
        }
        .package-effect .confetti:nth-child(2) {
            top: -25px;
            right: -30px;
            animation-delay: 2.8s;
        }
        .package-effect .confetti:nth-child(3) {
            bottom: -20px;
            left: -20px;
            animation-delay: 2.9s;
        }
        .package-effect .confetti:nth-child(4) {
            bottom: -25px;
            right: -25px;
            animation-delay: 3.0s;
        }
        .package-effect .confetti:nth-child(5) {
            top: -30px;
            left: 0;
            animation-delay: 3.1s;
        }
        .package-effect .confetti:nth-child(6) {
            bottom: -30px;
            right: 0;
            animation-delay: 3.2s;
        }

        @keyframes confettiFall {
            0% {
                opacity: 0;
                transform: translateY(-20px) rotate(0deg) scale(0);
            }
            50% {
                opacity: 1;
                transform: translateY(10px) rotate(180deg) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(40px) rotate(360deg) scale(0.5);
            }
        }

        /* ============================================================
           6) START BUTTON
           ============================================================ */
        .start-btn {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            padding: 14px 48px;
            background: linear-gradient(135deg, #ff6b35, #e55a2b);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            opacity: 0;
            animation: btnFadeIn 0.8s ease forwards;
            animation-delay: 5.2s;
            box-shadow: 0 4px 30px rgba(255, 107, 53, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .start-btn:hover {
            transform: translateX(-50%) scale(1.05);
            box-shadow: 0 6px 40px rgba(255, 107, 53, 0.6);
        }

        .start-btn:active {
            transform: translateX(-50%) scale(0.95);
        }

        @keyframes btnFadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(30px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
        }

        /* ============================================================
           7) LOADING BAR
           ============================================================ */
        .loading-bar {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 3px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            overflow: hidden;
            z-index: 2;
            opacity: 0;
            animation: barFade 0.5s ease forwards;
            animation-delay: 0.3s;
        }

        @keyframes barFade {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .loading-bar .bar-progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, #ff6b35, #ff4500);
            border-radius: 2px;
            animation: loadProgress 10s ease-in-out forwards;
            box-shadow: 0 0 20px rgba(255, 107, 53, 0.3);
        }

        @keyframes loadProgress {
            0% {
                width: 0%;
            }
            5% {
                width: 8%;
            }
            15% {
                width: 20%;
            }
            30% {
                width: 38%;
            }
            50% {
                width: 55%;
            }
            70% {
                width: 72%;
            }
            85% {
                width: 88%;
            }
            95% {
                width: 96%;
            }
            100% {
                width: 100%;
            }
        }

        /* ============================================================
           8) LOADING TEXT
           ============================================================ */
        .loading-text {
            position: absolute;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.2);
            font-size: 11px;
            letter-spacing: 4px;
            z-index: 2;
            animation: textPulse 1.5s ease-in-out infinite;
        }

        @keyframes textPulse {
            0%,
            100% {
                opacity: 0.2;
            }
            50% {
                opacity: 0.6;
            }
        }

        /* ============================================================
           9) SPINNER
           ============================================================ */
        .spinner {
            position: absolute;
            bottom: 130px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 24px;
            border: 2px solid rgba(255, 255, 255, 0.05);
            border-top-color: #ff6b35;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            z-index: 2;
            opacity: 0;
            animation: spin 0.8s linear infinite, spinnerFade 0.5s ease 0.5s forwards;
        }

        @keyframes spinnerFade {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes spin {
            to {
                transform: translateX(-50%) rotate(360deg);
            }
        }

        /* ============================================================
           10) RESPONSIVE
           ============================================================ */
        @media (max-width: 480px) {
            .logo-wrapper h1 {
                font-size: 32px;
                letter-spacing: 4px;
            }

            .logo-wrapper .logo-icon {
                font-size: 60px;
            }

            .truck-container .truck {
                font-size: 36px;
            }

            .text-reveal .slogan {
                font-size: 16px;
            }

            .map-container {
                width: 220px;
                bottom: 70px;
            }

            .start-btn {
                padding: 12px 32px;
                font-size: 14px;
                bottom: 30px;
            }

            .package-effect {
                font-size: 22px;
            }
        }

        @media (min-width: 768px) {
            .logo-wrapper h1 {
                font-size: 64px;
                letter-spacing: 8px;
            }

            .logo-wrapper .logo-icon {
                font-size: 100px;
            }

            .truck-container .truck {
                font-size: 64px;
            }

            .map-container {
                width: 400px;
            }

            .text-reveal .slogan {
                font-size: 28px;
            }
        }

        /* ============================================================
           11) HOME PAGE (After Splash)
           ============================================================ */
        .home-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 500;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        .home-page.active {
            opacity: 1;
            pointer-events: all;
        }

        .home-content {
            text-align: center;
            padding: 20px;
            animation: homeFade 0.8s ease forwards;
        }

        @keyframes homeFade {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .home-content .big-icon {
            font-size: 72px;
            margin-bottom: 12px;
        }

        .home-content h1 {
            font-size: 32px;
            font-weight: 800;
            color: white;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #ff6b35, #ff4500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .home-content p {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .home-content .home-btn {
            padding: 14px 40px;
            background: linear-gradient(135deg, #ff6b35, #e55a2b);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 30px rgba(255, 107, 53, 0.3);
        }

        .home-content .home-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 40px rgba(255, 107, 53, 0.5);
        }

        .home-content .home-btn:active {
            transform: scale(0.95);
        }

        .home-content .features {
            display: flex;
            gap: 30px;
            margin: 20px 0;
            justify-content: center;
            flex-wrap: wrap;
        }

        .home-content .features .feat {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            text-align: center;
        }

        .home-content .features .feat .icon {
            font-size: 24px;
            display: block;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <!-- ============================================================
    SPLASH SCREEN
    ============================================================ -->
    <div class="splash-container" id="splashContainer">

        <!-- Background Particles -->
        <div class="bg-particles" id="bgParticles"></div>

        <!-- 1) LOGO -->
        <div class="logo-wrapper">
            <span class="logo-icon">🚚</span>
            <h1>ETHIO DELIVERY</h1>
            <div class="subtitle">ፈጣን እና <span class="highlight">አስተማማኝ</span> መላኪያ</div>
        </div>

        <!-- 2) DELIVERY TRUCK -->
        <div class="truck-container" id="truckContainer">
            <div class="truck">🚚</div>
            <div class="truck-trail"></div>
        </div>

        <!-- 3) MAP ROUTE -->
        <div class="map-container">
            <div class="map-line">
                <div class="line-progress"></div>
            </div>
            <div class="map-pins">
                <span class="pin start">📍</span>
                <span class="pin end">📍</span>
            </div>
        </div>

        <!-- Package Delivered Effect -->
        <div class="package-effect" id="packageEffect">
            📦
            <span class="confetti">🎉</span>
            <span class="confetti">✨</span>
            <span class="confetti">🎊</span>
            <span class="confetti">⭐</span>
            <span class="confetti">🎈</span>
            <span class="confetti">🌟</span>
        </div>

        <!-- 4) TEXT REVEAL -->
        <div class="text-reveal">
            <div class="slogan" id="sloganText">
                <span>S</span><span>h</span><span>o</span><span>p</span>
                <span>&nbsp;</span>
                <span>A</span><span>n</span><span>y</span><span>t</span><span>h</span><span>i</span><span>n</span><span>g</span>
                <span>.</span>
                <span>&nbsp;</span>
                <span>D</span><span>e</span><span>l</span><span>i</span><span>v</span><span>e</span><span>r</span>
                <span>&nbsp;</span>
                <span>A</span><span>n</span><span>y</span><span>w</span><span>h</span><span>e</span><span>r</span><span>e</span>
                <span>.</span>
            </div>
            <div class="sub-slogan">✦ ፈጣን እና አስተማማኝ አገልግሎት ✦</div>
        </div>

        <!-- Loading Bar -->
        <div class="loading-bar">
            <div class="bar-progress"></div>
        </div>

        <!-- Loading Text -->
        <div class="loading-text">LOADING...</div>

        <!-- Spinner -->
        <div class="spinner"></div>

        <!-- 5) START BUTTON -->
        <button class="start-btn" id="startBtn" onclick="goToHome()">
            🚀 START SHOPPING
        </button>
    </div>

    <!-- ============================================================
    HOME PAGE
    ============================================================ -->
    <div class="home-page" id="homePage">
        <div class="home-content">
            <div class="big-icon">🚚</div>
            <h1>Ethio Delivery</h1>
            <p>ፈጣን እና አስተማማኝ መላኪያ አገልግሎት</p>

            <div class="features">
                <div class="feat">
                    <span class="icon">📦</span>
                    ፈጣን መላኪያ
                </div>
                <div class="feat">
                    <span class="icon">🔒</span>
                    አስተማማኝ ክፍያ
                </div>
                <div class="feat">
                    <span class="icon">⭐</span>
                    ጥራት ያላቸው አገልግሎቶች
                </div>
            </div>

            <button class="home-btn" onclick="openApp()">
                📱 አገልግሎቱን ክፈት
            </button>
        </div>
    </div>

    <!-- ============================================================
    JAVASCRIPT
    ============================================================ -->
    <script>
        // ============================================================
        // BACKGROUND PARTICLES
        // ============================================================
        function createParticles() {
            const container = document.getElementById('bgParticles');
            const count = 35;
            for (let i = 0; i < count; i++) {
                const span = document.createElement('span');
                span.style.left = Math.random() * 100 + '%';
                span.style.width = (Math.random() * 4 + 2) + 'px';
                span.style.height = span.style.width;
                span.style.animationDuration = (Math.random() * 10 + 6) + 's';
                span.style.animationDelay = (Math.random() * 12) + 's';
                span.style.opacity = Math.random() * 0.3 + 0.05;
                container.appendChild(span);
            }
        }
        createParticles();

        // ============================================================
        // GO TO HOME
        // ============================================================
        function goToHome() {
            const splash = document.getElementById('splashContainer');
            const home = document.getElementById('homePage');

            splash.classList.add('hidden');

            setTimeout(() => {
                home.classList.add('active');
                splash.style.display = 'none';
            }, 800);
        }

        // ============================================================
        // OPEN APP
        // ============================================================
        function openApp() {
            // Check if in Telegram
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.sendData(JSON.stringify({
                    action: 'open_app',
                    user_id: tg.initDataUnsafe?.user?.id || null
                }));
                tg.close();
            } else {
                // Fallback
                window.location.href = window.location.pathname + '?app=open';
            }
        }

        // ============================================================
        // AUTO TRANSITION AFTER 10 SECONDS
        // ============================================================
        setTimeout(() => {
            const splash = document.getElementById('splashContainer');
            if (!splash.classList.contains('hidden')) {
                goToHome();
            }
        }, 10000);

        // ============================================================
        // KEYBOARD SHORTCUT
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                const splash = document.getElementById('splashContainer');
                if (!splash.classList.contains('hidden')) {
                    goToHome();
                }
            }
        });

        // ============================================================
        // PREVENT SCROLLING
        // ============================================================
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });

        console.log('✅ Ethio Delivery Splash Animation loaded!');
        console.log('🎬 Animation timeline (10 seconds):');
        console.log('  0.0s - Logo fade in + zoom');
        console.log('  0.5s - Truck starts moving');
        console.log('  1.5s - Map route draws');
        console.log('  2.5s - Package delivered effect');
        console.log('  3.0s - Text reveal starts');
        console.log('  5.2s - Start button appears');
        console.log('  10.0s - Auto transition to home');
    </script>
</body>
</html>
