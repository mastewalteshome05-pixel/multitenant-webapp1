<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ============================================================
           CSS VARIABLES & RESET
           ============================================================ */
        :root {
            --primary: #2481cc;
            --primary-dark: #1a6aa8;
            --primary-light: #e8f4fd;
            --secondary: #ff6b35;
            --success: #2ecc71;
            --danger: #e74c3c;
            --warning: #f39c12;
            --dark: #1a1a2e;
            --gray: #6c757d;
            --light-gray: #f8f9fa;
            --white: #ffffff;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
            --shadow-hover: 0 8px 30px rgba(0,0,0,0.15);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Dark Mode */
        [data-theme="dark"] {
            --primary: #4a9eff;
            --primary-dark: #3a7fd4;
            --primary-light: #1a2a3a;
            --light-gray: #1e1e2e;
            --white: #2a2a3e;
            --dark: #f0f0f0;
            --shadow: 0 4px 20px rgba(0,0,0,0.3);
            --shadow-hover: 0 8px 30px rgba(0,0,0,0.4);
            --gray: #aaa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: var(--light-gray);
            color: var(--dark);
            min-height: 100vh;
            padding: 0;
            margin: 0;
            transition: var(--transition);
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 20px 16px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 20px rgba(36, 129, 204, 0.3);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1 span {
            background: rgba(255,255,255,0.2);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .header-btn {
            background: rgba(255,255,255,0.15);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .header-btn:hover {
            background: rgba(255,255,255,0.25);
            transform: scale(1.05);
        }

        .cart-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--secondary);
            color: white;
            font-size: 10px;
            font-weight: 700;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--primary);
        }

        /* ============================================================
           SEARCH BAR
           ============================================================ */
        .search-container {
            max-width: 600px;
            margin: -12px auto 16px;
            padding: 0 16px;
            position: relative;
            z-index: 10;
        }

        .search-box {
            background: var(--white);
            border-radius: var(--radius);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .search-box:focus-within {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }

        .search-box i {
            color: var(--gray);
            font-size: 18px;
        }

        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            background: transparent;
            color: var(--dark);
        }

        .search-box input::placeholder {
            color: var(--gray);
        }

        /* ============================================================
           CATEGORIES
           ============================================================ */
        .categories {
            max-width: 600px;
            margin: 0 auto 16px;
            padding: 0 16px;
            overflow-x: auto;
            display: flex;
            gap: 10px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .category-chip {
            background: var(--white);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            color: var(--dark);
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
            box-shadow: var(--shadow);
            border: 2px solid transparent;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .category-chip:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .category-chip.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .category-chip i {
            font-size: 14px;
        }

        /* ============================================================
           PRODUCT LIST
           ============================================================ */
        .product-list {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 16px 100px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .product-card {
            background: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        .product-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #e0e0e0, #f5f5f5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            color: var(--gray);
            position: relative;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: var(--secondary);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .product-badge.sale {
            background: var(--danger);
        }

        .product-badge.new {
            background: var(--success);
        }

        .product-info {
            padding: 16px;
            flex: 1;
        }

        .product-name {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--dark);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-store {
            font-size: 13px;
            color: var(--gray);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .product-store i {
            font-size: 12px;
        }

        .product-rating {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 8px;
        }

        .product-rating .stars {
            color: var(--warning);
            font-size: 14px;
            letter-spacing: 1px;
        }

        .product-rating .count {
            font-size: 12px;
            color: var(--gray);
        }

        .product-price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }

        .product-price {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
        }

        .product-price .original {
            font-size: 14px;
            color: var(--gray);
            text-decoration: line-through;
            font-weight: 400;
            margin-left: 8px;
        }

        .product-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            justify-content: center;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: scale(1.02);
        }

        .btn-secondary {
            background: var(--secondary);
            color: white;
        }

        .btn-secondary:hover {
            background: #e55a2b;
            transform: scale(1.02);
        }

        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary);
            color: white;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #27ae60;
            transform: scale(1.02);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
            transform: scale(1.02);
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 12px;
        }

        .btn-icon {
            width: 38px;
            height: 38px;
            padding: 0;
            border-radius: 50%;
        }

        /* ============================================================
           CART / CHECKOUT
           ============================================================ */
        .cart-overlay {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--white);
            border-radius: var(--radius) var(--radius) 0 0;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.15);
            padding: 20px;
            max-height: 80vh;
            overflow-y: auto;
            z-index: 200;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .cart-overlay.open {
            transform: translateY(0);
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--light-gray);
        }

        .cart-header h2 {
            font-size: 20px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--light-gray);
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-weight: 500;
        }

        .cart-item-price {
            font-size: 14px;
            color: var(--gray);
        }

        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cart-item-actions button {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-item-actions .qty-btn {
            background: var(--light-gray);
            color: var(--dark);
        }

        .cart-item-actions .qty-btn:hover {
            background: var(--primary);
            color: white;
        }

        .cart-total {
            padding: 16px 0;
            border-top: 2px solid var(--light-gray);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: 700;
        }

        .cart-total .amount {
            color: var(--primary);
            font-size: 24px;
        }

        .cart-actions {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .cart-actions .btn {
            flex: 1;
        }

        /* ============================================================
           TOAST NOTIFICATIONS
           ============================================================ */
        .toast-container {
            position: fixed;
            top: 80px;
            right: 16px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 320px;
        }

        .toast {
            background: var(--dark);
            color: var(--white);
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-hover);
            font-size: 14px;
            animation: slideIn 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast.success { border-left: 4px solid var(--success); }
        .toast.error { border-left: 4px solid var(--danger); }
        .toast.warning { border-left: 4px solid var(--warning); }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* ============================================================
           EMPTY STATE
           ============================================================ */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--gray);
        }

        .empty-state i {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 20px;
            margin-bottom: 8px;
            color: var(--dark);
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (min-width: 640px) {
            .product-list {
                grid-template-columns: 1fr 1fr;
            }
            
            .product-image {
                height: 180px;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 18px;
            }
            
            .product-price {
                font-size: 17px;
            }
            
            .btn {
                padding: 8px 14px;
                font-size: 13px;
            }
            
            .cart-overlay {
                padding: 16px;
            }
        }

        /* ============================================================
           LOADING
           ============================================================ */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--gray);
        }

        .loading i {
            font-size: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ============================================================
           SCROLLBAR
           ============================================================ */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: var(--light-gray);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }
    </style>
</head>

            {
                id: 8,
                name: 'የሴቶች ቦርሳ',
                nameEn: 'Handbag',
                price: 2800,
                originalPrice: 3500,
                category: 'fashion',
                image: '👛',
                store: 'Fashion Hub',
                rating: 4.4,
                reviews: 67,
                badge: '',
                description: 'ዘመናዊ የሴቶች ቦርሳ'
            }
        ];

        // ============================================================
        // INIT
        // ============================================================
        function init() {
            state.products = productsData;
            renderProducts();
            updateCartBadge();
            
            // Check for saved theme
            if (localStorage.getItem('ethiosuq-dark') === 'true') {
                document.body.setAttribute('data-theme', 'dark');
                state.darkMode = true;
                document.getElementById('themeToggle').innerHTML = '<i class="fas fa-sun"></i>';
            }

            // Close cart on outside click
            document.addEventListener('click', function(e) {
                const overlay = document.getElementById('cartOverlay');
                if (overlay.classList.contains('open')) {
                    if (!overlay.contains(e.target) && e.target.id !== 'cartBtn') {
                        toggleCart();
                    }
                }
            });

            console.log('✅ EthioSuq Mini App loaded!');
            console.log('👤 User ID:', state.userId);
        }

        // ============================================================
        // RENDER PRODUCTS
        // ============================================================
        function renderProducts() {
            const container = document.getElementById('productList');
            const filtered = getFilteredProducts();

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-box-open"></i>
                        <h3>ምንም ምርት አልተገኘም</h3>
                        <p>እባክዎ ሌላ ፍለጋ ይሞክሩ</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(product => `
                <div class="product-card" data-id="${product.id}">
                    <div class="product-image">
                        ${product.image}
                        ${product.badge ? `<span class="product-badge ${product.badge}">${product.badge === 'sale' ? '🎯 ቅናሽ' : '🆕 አዲስ'}</span>` : ''}
                    </div>
                    <div class="product-info">
                        <div class="product-name">${product.name}</div>
                        <div class="product-store">
                            <i class="fas fa-store"></i> ${product.store}
                        </div>
                        <div class="product-rating">
                            <span class="stars">${'⭐'.repeat(Math.floor(product.rating))}</span>
                            <span class="count">(${product.reviews})</span>
                        </div>
                        <div class="product-price-row">
                            <div class="product-price">
                                ${product.price} ብር
                                ${product.originalPrice ? `<span class="original">${product.originalPrice} ብር</span>` : ''}
                            </div>
                            <div class="product-actions">
                                <button class="btn btn-primary btn-sm" onclick="addToCart(${product.id})">
                                    <i class="fas fa-cart-plus"></i> ጨምር
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // ============================================================
        // FILTER PRODUCTS
        // ============================================================
        function getFilteredProducts() {
            let filtered = state.products;

            if (state.currentCategory !== 'all') {
                filtered = filtered.filter(p => p.category === state.currentCategory);
            }

            if (state.searchQuery.trim()) {
                const query = state.searchQuery.toLowerCase();
                filtered = filtered.filter(p => 
                    p.name.toLowerCase().includes(query) || 
                    p.nameEn.toLowerCase().includes(query) ||
                    p.store.toLowerCase().includes(query)
                );
            }

            return filtered;
        }

        function filterCategory(category, element) {
            state.currentCategory = category;
            document.querySelectorAll('.category-chip').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            renderProducts();
        }

        function searchProducts() {
            state.searchQuery = document.getElementById('searchInput').value;
            renderProducts();
        }

        // ============================================================
        // CART FUNCTIONS
        // ============================================================
        function addToCart(productId) {
            const product = state.products.find(p => p.id === productId);
            if (!product) return;

            const existing = state.cart.find(item => item.id === productId);
            if (existing) {
                existing.quantity += 1;
            } else {
                state.cart.push({ ...product, quantity: 1 });
            }

            updateCartBadge();
            showToast(`${product.name} ወደ ጋሪ ተጨምሯል! 🛒`, 'success');
            
            // Haptic feedback
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        }

        function removeFromCart(productId) {
            state.cart = state.cart.filter(item => item.id !== productId);
            updateCartBadge();
            renderCartItems();
            showToast('ከጋሪ ተወግዷል', 'warning');
        }

        function updateQuantity(productId, change) {
            const item = state.cart.find(i => i.id === productId);
            if (!item) return;

            item.quantity += change;
            if (item.quantity <= 0) {
                removeFromCart(productId);
                return;
            }
            renderCartItems();
            updateCartBadge();
        }

        function clearCart() {
            if (state.cart.length === 0) return;
            if (confirm('ጋሪዎን ማጽዳት እርግጠኛ ነዎት?')) {
                state.cart = [];
                updateCartBadge();
                renderCartItems();
                showToast('ጋሪ ጸድቷል', 'warning');
            }
        }

        function getCartTotal() {
            return state.cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        }

        function getCartCount() {
            return state.cart.reduce((sum, item) => sum + item.quantity, 0);
        }

        function updateCartBadge() {
            const count = getCartCount();
            document.getElementById('cartBadge').textContent = count;
            document.getElementById('cartBadge').style.display = count > 0 ? 'flex' : 'none';
        }

        function toggleCart() {
            const overlay = document.getElementById('cartOverlay');
            overlay.classList.toggle('open');
            if (overlay.classList.contains('open')) {
                renderCartItems();
            }
        }

        function renderCartItems() {
            const container = document.getElementById('cartItems');
            
            if (state.cart.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-shopping-cart"></i>
                        <h3>ጋሪዎ ባዶ ነው</h3>
                        <p>ምርቶችን ይጨምሩ</p>
                    </div>
                `;
                document.getElementById('cartTotal').textContent = '0 ብር';
                return;
            }

            container.innerHTML = state.cart.map(item => `
                <div class="cart-item">
                    <div class="cart-item-info">
                        <div class="cart-item-name">${item.name}</div>
                        <div class="cart-item-price">${item.price} ብር × ${item.quantity}</div>
                    </div>
                    <div class="cart-item-actions">
                        <button class="qty-btn" onclick="updateQuantity(${item.id}, -1)">−</button>
                        <span style="min-width:24px;text-align:center;">${item.quantity}</span>
                        <button class="qty-btn" onclick="updateQuantity(${item.id}, 1)">+</button>
                        <button class="btn btn-danger btn-sm" onclick="removeFromCart(${item.id})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('');

            document.getElementById('cartTotal').textContent = getCartTotal() + ' ብር';
        }

        // ============================================================
        // CHECKOUT
        // ============================================================
        function checkout() {
            if (state.cart.length === 0) {
                showToast('ጋሪዎ ባዶ ነው!', 'error');
                return;
            }

            const total = getCartTotal();
            const items = state.cart.map(item => `${item.name} x${item.quantity}`).join(', ');

            // Send order to Telegram
            if (tg) {
                tg.sendData(JSON.stringify({
                    action: 'checkout',
                    user_id: state.userId,
                    items: state.cart,
                    total: total
                }));

                // Close mini app
                tg.close();
            }

            // Also send to server
            fetch('/api/order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_id: state.userId,
                    items: state.cart,
                    total: total,
                    order_date: new Date().toISOString()
                })
            })
            .then(res => res.json())
            .then(data => {
                console.log('✅ Order placed:', data);
                showToast(`🎉 ትዕዛዝ ተልኳል! (${total} ብር)`, 'success');
                state.cart = [];
                updateCartBadge();
                toggleCart();
                renderProducts();
            })
            .catch(err => {
                console.error('❌ Order error:', err);
                showToast('❌ ስህተት ተከስቷል', 'error');
            });
        }

        // ============================================================
        // THEME TOGGLE
        // ============================================================
        function toggleTheme() {
            state.darkMode = !state.darkMode;
            document.body.setAttribute('data-theme', state.darkMode ? 'dark' : 'light');
            document.getElementById('themeToggle').innerHTML = state.darkMode ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
            localStorage.setItem('ethiosuq-dark', state.darkMode);
        }

        // ============================================================
        // TOAST NOTIFICATIONS
        // ============================================================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const icons = {
                success: '✅',
                error: '❌',
                warning: '⚠️',
                info: 'ℹ️'
            };
            
            toast.innerHTML = `${icons[type] || 'ℹ️'} ${message}`;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ============================================================
        // INITIALIZE
        // ============================================================
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
